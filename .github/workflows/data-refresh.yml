# Builds the FinSight data set (ML predictions, backtests, charts, Top-5 picks)
# and publishes it to GitHub Pages. The frontend on Vercel reads these files
# through a /data/* rewrite, so there is no backend server to run or pay for.
#
# First run: the configure-pages step enables Pages for the repository. If it
# cannot (permissions), enable it once under Settings → Pages → Source: GitHub Actions.
name: Refresh market data

on:
  schedule:
    - cron: "17 */6 * * *"        # every 6 hours; the inputs are daily candles
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/data-refresh.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  build:
    name: Analyse all assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Build data set
        env:
          OMP_NUM_THREADS: "1"
          PYTHONUNBUFFERED: "1"
          # Reuse yesterday's result for assets whose latest candle is unchanged
          REUSE_BASE_URL: https://naveenrod.github.io/Crypto-stock-webpage/data
        run: python backend/scripts/build_static.py --out site/data --workers 2 --timeout 2100

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json; m = json.load(open("site/data/manifest.json"))
          print(f"**{m['assets_ok']}/{m['assets_total']} assets analysed in {m['duration_seconds']} s** "
                f"({m.get('reused', 0)} reused unchanged, {m.get('recomputed', 0)} recomputed)")
          if m["failed"]:  print("\nFailed: " + ", ".join(m["failed"]))
          if m["missing"]: print("\nTimed out: " + ", ".join(m["missing"]))
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

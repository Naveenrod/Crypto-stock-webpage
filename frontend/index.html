<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FinSight — Crypto & Stock Analyzer</title>
    <meta name="description" content="Crypto, US and ASX stock analysis with ML predictions, backtests and live news — retrained hourly." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://www.crypto-fininsight.xyz/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FinSight" />
    <meta property="og:title" content="FinSight — AI-powered market analyzer" />
    <meta property="og:description" content="Top ML picks, predictions and backtests for 225 crypto and stock assets, retrained hourly. Not financial advice." />
    <meta property="og:url" content="https://www.crypto-fininsight.xyz/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FinSight — AI-powered market analyzer" />
    <meta name="twitter:description" content="Top ML picks, predictions and backtests for crypto, US and ASX stocks, retrained hourly." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Apply the saved theme before first paint to avoid a flash. Light is the default. -->
    <script>
      try { if (localStorage.getItem("finsight-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
